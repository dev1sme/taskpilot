# =====================================================================
#  Claude Task Board – cấu hình
#  Đặt file này cạnh claude-task-board.jar rồi sửa các giá trị bên dưới.
#  (Hoặc chạy: java -jar claude-task-board.jar --config=đường/dẫn/application.yml)
# =====================================================================

server:
  address: 127.0.0.1      # chỉ mở trên máy mình
  port: 8787

board:
  # Ngôn ngữ Claude dùng khi viết tài liệu .md
  doc-language: "tiếng Việt"

  repo:
    # Đường dẫn repo code. Ví dụ Windows: "D:/projects/my-app"
    path: ""
    # Tài liệu mỗi task sẽ nằm ở <repo>/<tasks-dir>/<tên thư mục>/
    tasks-dir: ".claude/tasks"
    # Tên thư mục cho mỗi task. Dùng {issueKey} và/hoặc {slug} (tóm tắt không dấu)
    # Ví dụ: "{issueKey}"  ->  PROJ-123
    #        "{issueKey}-{slug}"  ->  PROJ-123-them-api-xuat-csv
    folder-pattern: "{issueKey}"

  backlog:
    # Để trống base-url hoặc api-key = chạy chế độ demo với task mẫu
    base-url: ""            # ví dụ https://tencongty.backlog.com  (hoặc .backlog.jp)
    api-key: ""             # Backlog > Cá nhân > Cài đặt > API
    project-key: ""         # ví dụ PROJ
    only-mine: true         # chỉ lấy task giao cho mình
    exclude-statuses: ["完了", "Closed", "Đóng"]
    status-on-start: ""     # ví dụ "処理中" hoặc "In Progress"; trống = không đổi
    status-on-done: ""      # ví dụ "処理済み" hoặc "Resolved"; trống = không đổi
    comment-on-done: true   # đăng tóm tắt (04-summary.md) lên task khi xong

  claude:
    command: "claude"       # hoặc đường dẫn đầy đủ, ví dụ C:/Users/ten/.local/bin/claude.exe
    model: ""               # ví dụ "sonnet" hoặc "opus"; trống = mặc định
    simulate: false         # true = giả lập, không gọi Claude thật (để thử giao diện)
    investigate-slots: 3    # số task điều tra song song
    implement-slots: 1      # số task code cùng lúc (để 1 vì cùng sửa một repo)
    max-turns: 0            # 0 = không giới hạn
    max-budget-usd: 0       # 0 = không giới hạn chi phí mỗi lượt
    investigate-allowed-tools: ["Read", "Glob", "Grep"]
    # Lệnh shell Claude được tự chạy ở bước code. Lệnh khác bị từ chối và hiện trên giao diện,
    # khi đó có thể cấp thêm quyền cho riêng task đó rồi bấm "Chạy lại".
    implement-allowed-tools:
      - "Bash(mvn *)"
      - "Bash(./mvnw *)"
      - "Bash(mvnw *)"
      - "Bash(gradle *)"
      - "Bash(./gradlew *)"
      - "Bash(git status *)"
      - "Bash(git diff *)"
      - "Bash(git log *)"
      - "Bash(git add *)"
      - "Bash(git commit *)"
      - "Bash(git checkout -b *)"
      - "Bash(git switch -c *)"
    extra-args: []
