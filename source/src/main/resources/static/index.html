<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Task Board</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect x=%271%27 y=%272%27 width=%274%27 height=%2712%27 rx=%271%27 fill=%27%232f6fb0%27/%3E%3Crect x=%276%27 y=%272%27 width=%274%27 height=%278%27 rx=%271%27 fill=%27%23c98a12%27/%3E%3Crect x=%2711%27 y=%272%27 width=%274%27 height=%275%27 rx=%271%27 fill=%27%232e8b57%27/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Task Board</h1>
      <span id="project" class="project"></span>
    </div>
    <button id="waiting" class="waiting" type="button" hidden></button>
    <div class="top-actions">
      <span id="modes" class="modes"></span>
      <span id="conn" class="conn" title="Kết nối realtime"></span>
      <button id="refresh" class="btn ghost" type="button">Tải lại Backlog</button>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main id="board" class="board" aria-label="Bảng task"></main>

  <aside id="drawer" class="drawer" hidden aria-label="Chi tiết task">
    <div class="drawer-head">
      <div>
        <a id="d-key" class="d-key" target="_blank" rel="noopener"></a>
        <h2 id="d-summary"></h2>
        <p id="d-stage" class="d-stage"></p>
      </div>
      <button id="d-close" class="btn ghost icon" type="button" aria-label="Đóng">✕</button>
    </div>
    <section id="d-actions" class="d-actions"></section>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="log" aria-selected="true">Tiến trình</button>
      <button role="tab" data-tab="docs">Tài liệu</button>
      <button role="tab" data-tab="task">Nội dung task</button>
    </nav>
    <section id="tab-log" class="tab log" role="tabpanel"></section>
    <section id="tab-docs" class="tab docs" role="tabpanel" hidden>
      <div id="docs-list" class="docs-list"></div>
      <article id="docs-view" class="md"></article>
    </section>
    <section id="tab-task" class="tab" role="tabpanel" hidden>
      <article id="task-view" class="md"></article>
    </section>
  </aside>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
