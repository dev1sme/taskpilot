# Built-in TaskPilot workflow. A repo replaces it with its own copy in .claude/taskpilot/
# (Workflow page → "Thêm config override"); this directory is never edited from the UI.
version: 2
# permission-mode: acceptEdits        # default | acceptEdits | plan | auto
# Agent of every step: claude | copilot. A step's own `agent` overrides it, e.g. Claude
# investigates and Copilot implements: `agent: copilot` on the implement step.
# agent: claude

# The task's decision log: the heading Claude uses for its own entries ({{historyEntry}}) and the
# skeleton of a whole entry ({{historyFormat}}).
history:
  file: 00-history.md
  entry: "## <YYYY-MM-DD HH:MM> · {{step}} · Claude"
  format: format-history.md

# {{language}} and {{rules}} in the prompts below. Each output's `format` is a skeleton file shown
# in {{outputs}}: Claude keeps its headings and fills every section.
language: Viết tài liệu bằng cùng ngôn ngữ với spec.
rules:
  - "Chỉ thêm entry mới vào cuối {{historyFile}} bằng Edit; không viết lại hay xoá entry cũ."
  - Không push, không merge.
  - "Câu hỏi cho reviewer: đánh số, mỗi câu một dòng `1. <câu hỏi> — Đề xuất: <đề xuất của bạn>`. Không dùng tool AskUserQuestion (reviewer trả lời trên TaskPilot)."

# After "Chạy lại từ đầu", {{previousRun}} asks Claude to read these archived documents first.
restart:
  read: [plan, summary, progress]

steps:
  - id: investigate
    title: Điều tra & lên kế hoạch
    prompt: investigate.md
    on-reject: revise-plan.md
    outputs:
      - id: investigation
        file: 01-investigation.md
        content: phạm vi, file liên quan (kèm đường dẫn), hiện trạng phần đó, rủi ro
        format: format-investigation.md
      - id: plan
        file: 02-plan.md
        content: mục tiêu, thay đổi theo file, các bước theo thứ tự, rủi ro, cách verify (lệnh build/test chính xác), câu hỏi mở
        format: format-plan.md
    done-when: plan
    gate: approve

  - id: implement
    title: Triển khai
    # agent: copilot
    prompt: implement.md
    on-reject: revise-implementation.md
    outputs:
      - id: progress
        file: 03-progress.md
        content: checklist các bước của kế hoạch, kèm ghi chú vướng mắc; luôn cập nhật
        format: format-progress.md
      - id: summary
        file: 04-summary.md
        content: thay đổi gì, file đã sửa, kết quả build/test, việc còn lại, ghi chú cho reviewer
        format: format-summary.md
    done-when: summary
    gate: approve
